version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: cleansight-redis
    ports:
      - '6379:6379'
    # Disable persistence for a lean dev setup — data is ephemeral.
    # Remove these flags if you want AOF/RDB snapshots.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
